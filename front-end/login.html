<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conecta - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-box">

            <h1>CONECTA</h1>

            <p class="slogan">
                Você informa. A solução acontece.
            </p>

            <form>

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    ENTRAR
                </button>

            </form>

            <p class="cadastro">
                Ainda não possui conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </section>

    </main>

    <script>
const formulario = document.querySelector("form");

formulario.addEventListener("submit", async function(evento) {
    evento.preventDefault();

    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    try {
       const resposta = await fetch("https://ubiquitous-space-tribble-wvg7q9xpxp773g6xw-3000.app.github.dev/api/usuarios/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                senha: senha
            })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            alert(dados.erro || "Erro ao fazer login.");
            return;
        }

        localStorage.setItem("token", dados.token);

        window.location.href = "acompanhar.html";

    } catch (erro) {
        console.error(erro);
        alert("Não foi possível conectar ao servidor.");
    }
});
    </script>
</body>
</html>
