
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Cidadão - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-login">

    <header class="topo">
        <div class="logo">CONECTA</div>

        <button type="button" id="alternarTema"
            class="botao-tema" aria-label="Alternar tema">
            🌙 Modo escuro
        </button>
    </header>

    <main class="login-container">
        <section class="login-box">

            <div class="login-icone">✦</div>

            <h1>Crie sua conta no <span>CONECTA</span></h1>

            <p class="slogan">Faça parte da mudança!</p>

            <p class="login-descricao">
                Cadastre-se para compartilhar problemas e acompanhar soluções.
            </p>

            <form id="cadastroForm">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmarSenha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" class="botao-principal">
                    CRIAR CONTA →
                </button>
            </form>

            <p class="cadastro">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

            <a href="index.html" class="voltar-inicio">
                ← Voltar ao início
            </a>

        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
