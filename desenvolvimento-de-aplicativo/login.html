
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Conecta Cidadão</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #eee5ff,
                #d8c4ff,
                #b99aff
            );
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px 28px;
            border-radius: 25px;
            box-shadow: 0 12px 35px rgba(79, 29, 155, 0.18);
            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            color: #6725bf;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #78688e;
            margin-bottom: 30px;
        }

        h1 {
            color: #371184;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .descricao {
            color: #6c5c83;
            margin-bottom: 25px;
        }

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #49316e;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddc8fa;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #9149ec;
        }

        .botao-entrar {
            width: 100%;
            padding: 15px;
            background: linear-gradient(
                135deg,
                #9149ec,
                #5717c5
            );
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .botao-entrar:hover {
            background: #4b159f;
        }

        .criar-conta {
            margin-top: 25px;
            color: #6c5c83;
        }

        a {
            color: #6725bf;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .voltar {
            display: inline-block;
            margin-top: 25px;
        }

        .aviso {
            font-size: 13px;
            color: #78688e;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo">📍 CONECTA</div>
        <p class="subtitulo">Sua cidade, sua voz!</p>

        <h1>Bem-vindo de volta! 💜</h1>
        <p class="descricao">
            Entre para continuar fazendo a diferença na sua cidade.
        </p>

        <form id="formLogin">

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button class="botao-entrar" type="submit">
                Entrar →
            </button>

        </form>

        <p class="criar-conta">
            Ainda não tem uma conta?
            <a href="cadastro.html">Criar conta</a>
        </p>

        <a class="voltar" href="index.html">
            ← Voltar ao início
        </a>

        <p class="aviso">
            Tela demonstrativa. O login será integrado
            ao sistema de autenticação do projeto.
        </p>

    </main>

    <script>
        document.getElementById("formLogin")
            .addEventListener("submit", function(evento) {
                evento.preventDefault();

                alert(
                    "💜 Tela de login criada! " +
                    "A autenticação será conectada ao back-end."
                );
            });
    </script>

</body>
</html>
