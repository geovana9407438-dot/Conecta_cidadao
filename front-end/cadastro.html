<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="login-container">
    <section class="login-box">
        <h1>CONECTA</h1>
        <p class="slogan">Crie sua conta</p>

        <form id="cadastroForm">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Crie uma senha" minlength="6" required>

            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente" minlength="6" required>

            <button type="submit">CRIAR CONTA</button>
        </form>

        <p class="cadastro">
            Já possui uma conta?
            <a href="login.html">Entrar</a>
        </p>
    </section>
</main>

<script src="js/script.js"></script>
</body>
</html>
