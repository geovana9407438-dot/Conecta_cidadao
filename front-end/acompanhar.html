<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta - Acompanhar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo">
    <div class="logo">CONECTA</div>
    <nav>
        <a href="index.html">Início</a>
        <a href="painel.html">Painel</a>
        <a href="acompanhar.html">Acompanhar</a>
        <a href="login.html">Sair</a>
    </nav>
</header>

<main class="acompanhamento">

    <section class="cabecalho-pagina">
        <div>
            <span class="tag-pagina">MEUS PROBLEMAS</span>
            <h1>Acompanhe suas solicitações</h1>
            <p>Veja o andamento dos problemas que você cadastrou.</p>
        </div>
        <a href="cadastro-problema.html" class="botao-principal">+ Novo problema</a>
    </section>

    <section class="filtros">
        <button class="filtro ativo">Todos</button>
        <button class="filtro">🟡 Recebidos</button>
        <button class="filtro">🔵 Em andamento</button>
        <button class="filtro">🟢 Resolvidos</button>
    </section>

    <section class="lista-problemas" id="lista-problemas"></section>
        <script>
const API_URL = "";

async function carregarProblemas() {
    const token = localStorage.getItem("token");

    if (!token) {
        alert("Você precisa estar logado.");
        return;
    }

    try {
        const resposta = await fetch(`${API_URL}/api/problemas/`, {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            throw new Error(dados.erro || "Erro ao carregar problemas.");
        }

        mostrarProblemas(dados.problemas);

    } catch (erro) {
        console.error(erro);
        alert(erro.message);
    }
}

function mostrarProblemas(problemas) {
    const lista = document.getElementById("lista-problemas");

    if (problemas.length === 0) {
        lista.innerHTML = "<p>Nenhum problema cadastrado.</p>";
        return;
    }

    lista.innerHTML = problemas.map(problema => {

        let classeStatus = "recebido";
        let emojiStatus = "🟡";

        if (problema.status === "Em andamento") {
            classeStatus = "andamento";
            emojiStatus = "🔵";
        }

        if (problema.status === "Resolvido") {
            classeStatus = "resolvido";
            emojiStatus = "🟢";
        }

        return `
            <article class="problema-card">
                <div class="problema-topo">
                    <div>
                        <span class="categoria">📌 ${problema.area}</span>
                        <h2>${problema.titulo}</h2>
                    </div>

                    <span class="status ${classeStatus}">
                        ${emojiStatus} ${problema.status}
                    </span>
                </div>

                <p class="local">📍 ${problema.local}</p>

                <p class="descricao">${problema.descricao}</p>

                <div class="problema-info">
                    <span>Problema #${problema.id}</span>
                </div>
            </article>
        `;
    }).join("");
}

carregarProblemas();
</script>
    </section>
</main>

<footer>
    <p>© 2026 Conecta — Você informa. A solução acontece.</p>
</footer>

</body>
</html>
